<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Expediente Médico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 p-4 md:p-8 flex justify-center items-center min-h-screen">

    <div class="w-full max-w-2xl bg-white rounded-2xl border border-slate-200 shadow-xl overflow-hidden">
        <div class="bg-[#1E3A8A] p-6 text-white flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide">SISTEMA DE EMERGENCIAS MÉDICAS</h1>
                <p class="text-xs text-blue-200 mt-1">Consulta de Expediente Seguro via QR</p>
            </div>
            <span class="bg-red-500 text-white text-xs font-bold px-2.5 py-1 rounded animate-pulse">VISTA DE EMERGENCIA</span>
        </div>

        <div class="p-6 space-y-6" id="contenidoExpediente">
            <div class="text-center py-8 text-slate-500">
                <p class="animate-bounce text-xl">🔍</p>
                <p class="text-sm font-medium mt-2">Buscando registro en el servidor local...</p>
            </div>
        </div>
        
        <div class="bg-slate-100 px-6 py-4 border-t border-slate-200 flex justify-between items-center text-xs text-slate-500">
            <p>Hospital Universitario - Control de Acceso</p>
            <p id="fechaConsulta"></p>
        </div>
    </div>

    <script type="module">
        import { obtenerDefinicion } from './js/conectorMedico.js';

        // 1. Base de datos completa (15 usuarios semilla idénticos al panel principal)
        const usuariosSemilla = [
            { id: 1, nombre: "María García", edad: "34", sangre: "A+", hospital: "Hospital General de Especialidades Dr. Javier Buenfil Osorio", alergias: ["Mariscos", "Penicilina"], padecimientos: ["Diabetes tipo 2", "Hipertensión"], contacto: { nombre: "Carlos García", relacion: "Esposo", tel: "+52 981 123 4567" }, notas: "Paciente con control médico mensual. Toma metformina 500mg." },
            { id: 2, nombre: "Roberto Méndez", edad: "45", sangre: "O-", hospital: "Hospital General de Zona N1 IMSS", alergias: ["Polen"], padecimientos: ["Asma"], contacto: { nombre: "Laura Méndez", relacion: "Hermana", tel: "+52 981 765 4321" }, notas: "Usa inhalador de rescate en caso de crisis estacionales." },
            { id: 3, nombre: "Sofía Ramírez", edad: "28", sangre: "B+", hospital: "Clínica del ISSSTE", alergias: ["Látex", "Aspirina"], padecimientos: ["Migraña"], contacto: { nombre: "Pedro Ramírez", relacion: "Padre", tel: "+52 999 555 1234" }, notas: "Sensibilidad severa a analgésicos comunes del grupo de los AINEs." },
            { id: 4, nombre: "Alejandro Mendoza", edad: "19", sangre: "O+", hospital: "Hospital General de Especialidades", alergias: ["Nueces", "Maní"], padecimientos: [], contacto: { nombre: "Elena Mendoza", relacion: "Madre", tel: "+52 981 111 2233" }, notas: "Carga consigo un autoinyector de epinefrina en la mochila de forma regular." },
            { id: 5, nombre: "Beatriz Elena Soler", edad: "62", sangre: "AB+", hospital: "Hospital General de Zona N1 IMSS", alergias: [], padecimientos: ["Hipotiroidismo", "Artritis reumatoide"], contacto: { nombre: "Ricardo Soler", relacion: "Hijo", tel: "+52 981 444 5566" }, notas: "Tratamiento diario con Levotiroxina en ayunas." },
            { id: 6, nombre: "Carlos Eduardo Ortiz", edad: "51", sangre: "A-", hospital: "Clínica del ISSSTE", alergias: ["Aspirina"], padecimientos: ["Hipertensión", "Insuficiencia renal"], contacto: { nombre: "Patricia Ortiz", relacion: "Hija", tel: "+52 981 888 9900" }, notas: "Restricción estricta de sodio en la dieta. Monitoreo de presión constante." },
            { id: 7, nombre: "Diana Laura Flores", edad: "24", sangre: "B-", hospital: "Hospital General de Especialidades Dr. Javier Buenfil Osorio", alergias: ["Picadura de abeja"], padecimientos: ["Epilepsia"], contacto: { nombre: "Manuel Flores", relacion: "Padre", tel: "+52 981 222 3344" }, notas: "En tratamiento anticonvulsivo estricto. Evitar luces estroboscópicas." },
            { id: 8, nombre: "Gabriel Heinz Vega", edad: "38", sangre: "O+", hospital: "Hospital General de Zona N1 IMSS", alergias: ["Trigo", "Leche"], padecimientos: ["Enfermedad celíaca"], contacto: { nombre: "Sofía Vega", relacion: "Esposa", tel: "+52 999 111 7788" }, notas: "Intolerancia severa y daño autoinmune por ingesta de gluten." },
            { id: 9, nombre: "Lucía Fernanda Paz", edad: "29", sangre: "AB-", hospital: "Hospital General de Especialidades", alergias: ["Ácaros", "Polen"], padecimientos: ["Asma"], contacto: { nombre: "Andrés Paz", relacion: "Hermano", tel: "+52 981 102 9384" }, notas: "Crisis asmáticas detonadas recurrentemente por cambios bruscos de clima." },
            { id: 10, nombre: "Ricardo Javier Trejo", edad: "57", sangre: "O-", hospital: "Clínica del ISSSTE", alergias: [], padecimientos: ["Cardiopatía isquémica", "Hipertensión"], contacto: { nombre: "Adriana Trejo", relacion: "Esposa", tel: "+52 981 475 1122" }, notas: "Portador de stent coronario colocado hace 1 año. Toma anticoagulantes." },
            { id: 11, nombre: "Valeria Sofía Cruz", edad: "41", sangre: "A+", hospital: "Hospital General de Zona N1 IMSS", alergias: ["Penicilina"], padecimientos: ["Lupus", "Anemia crónica"], contacto: { nombre: "Jorge Cruz", relacion: "Padre", tel: "+52 999 321 4365" }, notas: "Tratamiento inmunosupresor activo. Monitorear recuentos hemáticos." },
            { id: 12, nombre: "Mauricio Alan Gomez", edad: "33", sangre: "B+", hospital: "Hospital General de Especialidades", alergias: ["Mariscos"], padecimientos: ["Ansiedad crónica"], contacto: { nombre: "Mónica Gomez", relacion: "Madre", tel: "+52 981 813 5500" }, notas: "Propensión a ataques de pánico en situaciones de confinamiento médico." },
            { id: 13, nombre: "Elena Rostova Vega", edad: "70", sangre: "O+", hospital: "Clínica del ISSSTE", alergias: ["Látex"], padecimientos: ["Alzheimer", "Osteoporosis"], contacto: { nombre: "Dmitri Vega", relacion: "Hijo", tel: "+52 981 152 7744" }, notas: "Paciente dependiente de cuidados constantes por desorientación avanzada." },
            { id: 14, nombre: "Héctor Manuel Lugo", edad: "48", sangre: "A+", hospital: "Hospital General de Zona N1 IMSS", alergias: ["Huevo"], padecimientos: ["Epoc"], contacto: { nombre: "Rosa Lugo", relacion: "Hija", tel: "+52 981 112 3344" }, notas: "Ex-fumador severo con requerimiento de oxigenoterapia nocturna." },
            { id: 15, nombre: "Patricia Inés Sosa", edad: "26", sangre: "O+", hospital: "Hospital General de Especialidades Dr. Javier Buenfil Osorio", alergias: ["Soja", "Maní"], padecimientos: ["Enfermedad de crohn"], contacto: { nombre: "Esteban Sosa", relacion: "Hermano", tel: "+52 999 445 1299" }, notas: "En tratamiento biológico. Monitorear síntomas inflamatorios estomacales." }
        ];

        // 2. Comprobación y Sincronización Dinámica con LocalStorage
        let usuariosGuardados = JSON.parse(localStorage.getItem('usuariosMedicos'));

        if (!usuariosGuardados || usuariosGuardados.length < usuariosSemilla.length) {
            localStorage.setItem('usuariosMedicos', JSON.stringify(usuariosSemilla));
            usuariosGuardados = usuariosSemilla;
        }

        const usuarios = usuariosGuardados;

        // 3. Leer el ID que viene en la URL (?id=X)
        const urlParams = new URLSearchParams(window.location.search);
        const usuarioId = parseInt(urlParams.get('id'));

        const contenedor = document.getElementById('contenidoExpediente');
        document.getElementById('fechaConsulta').innerText = new Date().toLocaleString();

        // 4. Buscar al usuario
        const usuario = isNaN(usuarioId) ? null : usuarios.find(u => u.id === usuarioId);

        if (!usuario) {
            contenedor.innerHTML = `
                <div class="text-center py-8 text-red-600">
                    <p class="text-3xl">⚠️</p>
                    <p class="font-bold text-lg mt-2">Error de Lectura</p>
                    <p class="text-sm text-slate-500 mt-1">El expediente solicitado no existe o fue dado de baja del sistema.</p>
                </div>
            `;
        } else {
            // 5. Inyectar la estructura de la Tabla Informativa completa
            contenedor.innerHTML = `
                <div class="flex items-center space-x-4 border-b border-slate-100 pb-4">
                    <div class="w-14 h-14 bg-[#1D4ED8] text-white flex items-center justify-center text-xl font-bold rounded-full shadow-md">
                        ${usuario.nombre.charAt(0).toUpperCase()}
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-slate-800">${usuario.nombre}</h2>
                        <p class="text-sm text-slate-500">Edad: ${usuario.edad || '--'} años</p>
                    </div>
                </div>

                <div class="overflow-hidden border border-slate-200 rounded-xl shadow-sm">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 border-b border-slate-200 text-xs font-semibold text-slate-700 uppercase tracking-wider">
                                <th class="px-4 py-3 w-1/3">Categoría</th>
                                <th class="px-4 py-3">Detalle Clínico / Definición del Conector</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200 text-sm text-slate-700">
                            <tr class="bg-red-50/40 hover:bg-red-50 transition">
                                <td class="px-4 py-3 font-semibold text-red-800 bg-red-50/20">🏥 Hospital Destino</td>
                                <td class="px-4 py-3 font-medium text-slate-900 leading-snug">
                                    ${usuario.hospital && usuario.hospital.trim() !== "" 
                                        ? usuario.hospital 
                                        : '<span class="text-slate-500 italic font-normal">No especificado (Trasladar a urgencias más cercana)</span>'}
                                </td>
                            </tr>
                            <tr class="hover:bg-slate-50 transition">
                                <td class="px-4 py-3 font-semibold text-[#1E3A8A] bg-slate-50/50">🩸 Tipo de Sangre</td>
                                <td class="px-4 py-3">
                                    <span class="bg-[#1E3A8A] text-white font-bold text-xs px-2.5 py-1 rounded-full mr-2">${usuario.sangre}</span>
                                    <span class="text-xs text-slate-500 block mt-1.5 italic">${obtenerDefinicion(usuario.sangre)}</span>
                                </td>
                            </tr>
                            <tr class="hover:bg-slate-50 transition">
                                <td class="px-4 py-3 font-semibold text-[#1E3A8A] bg-slate-50/50">⚠️ Alergias</td>
                                <td class="px-4 py-3">
                                    ${usuario.alergias && usuario.alergias.length ? usuario.alergias.map(a => `
                                        <div class="mb-2 last:mb-0">
                                            <span class="bg-blue-100 text-blue-800 font-medium text-xs px-2 py-0.5 rounded">${a}</span>
                                            <p class="text-xs text-slate-500 mt-0.5 italic">${obtenerDefinicion(a)}</p>
                                        </div>
                                    `).join('') : '<span class="text-slate-400 italic">Ninguna declarada</span>'}
                                </td>
                            </tr>
                            <tr class="hover:bg-slate-50 transition">
                                <td class="px-4 py-3 font-semibold text-[#1E3A8A] bg-slate-50/50">📈 Padecimientos</td>
                                <td class="px-4 py-3">
                                    ${usuario.padecimientos && usuario.padecimientos.length ? usuario.padecimientos.map(p => `
                                        <div class="mb-2 last:mb-0">
                                            <span class="bg-slate-800 text-white font-medium text-xs px-2 py-0.5 rounded">${p}</span>
                                            <p class="text-xs text-slate-500 mt-0.5 italic">${obtenerDefinicion(p)}</p>
                                        </div>
                                    `).join('') : '<span class="text-slate-400 italic">Ninguno declarado</span>'}
                                </td>
                            </tr>
                            <tr class="hover:bg-slate-50 transition">
                                <td class="px-4 py-3 font-semibold text-[#1E3A8A] bg-slate-50/50">📞 En caso de Emergencia</td>
                                <td class="px-4 py-3 space-y-0.5">
                                    <p class="font-medium text-slate-800">${usuario.contacto?.nombre || 'No asignado'}</p>
                                    <p class="text-xs text-slate-500">Relación: ${usuario.contacto?.relacion || '--'}</p>
                                    <p class="text-xs font-bold text-blue-600 mt-1">Tel: ${usuario.contacto?.tel || '--'}</p>
                                </td>
                            </tr>
                            <tr class="hover:bg-slate-50 transition">
                                <td class="px-4 py-3 font-semibold text-[#1E3A8A] bg-slate-50/50">📄 Notas Clínicas</td>
                                <td class="px-4 py-3 text-xs text-slate-600 leading-relaxed">
                                    ${usuario.notas || usuario.notes || 'Sin anotaciones adicionales.'}
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
        }
    </script>
</body>
</html>
